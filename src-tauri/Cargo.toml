[package]
name = "qiehuan-yingyong"
version = "0.1.13"
description = "切换应用"
authors = ["jlcodes", "lk"]
license = "CC-BY-NC-SA-4.0"
edition = "2021"

[lib]
name = "qiehuan_yingyong_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
swift-rs = { version = "1.0.7", features = ["build"] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = "0.4"
dirs = "5.0"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "zstd", "stream", "socks", "blocking"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"
tracing-log = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1.0"
sha2 = "0.10"
ring = "0.17"
url = "2.5"
regex = "1"
rand = "0.8"
sysinfo = "0.33"
libc = "0.2"
md5 = "0.7"
tiny_http = "0.12"
urlencoding = "2.1"
lazy_static = "1.5"
trash = "5"

# 账号凭证本地加密（account / secure_account_storage / trae_account）
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Native registry access for install detection. The upstream `cmd /u /c reg query`
# path fails on CN-locale Windows (reg returns "key not found" when wrapped by
# cmd) and would corrupt GBK-encoded paths; winreg reads REG_SZ as proper
# Unicode.
winreg = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
